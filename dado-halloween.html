<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dado de Halloween</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
/* Layout: dado 3D centrado sobre hoja cuadriculada; una sola mirada (papel claro) */
:root{
  --paper:#fafafa;
  --grid:#dcdcdc;
  --grid-strong:#b4b4b4;
  --ink:#2b3a4a;
  --face:#ffffff;
  --face-edge:#d9d9d2;
  --pip-red:#d62828;
  --pip-blue:#1f5fbf;
  --font-hand:'Patrick Hand','Comic Sans MS',cursive,sans-serif;
  --size:120px;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  background-position:-1px -1px;
  color:var(--ink);
  font-family:var(--font-hand);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;
  overflow-x:hidden;
}
.stage{perspective:700px;width:var(--size);height:var(--size);position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.stage:focus-visible{outline:3px dashed var(--pip-blue);outline-offset:24px}
.jump{width:100%;height:100%;transform-style:preserve-3d}
.jump.go{animation:jump 1.5s ease-in-out}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-42px)}}
.cube{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transform:rotateX(-50deg) rotateY(25deg) rotateZ(0deg) rotateX(90deg);
  transition:transform 1.5s cubic-bezier(.2,.7,.2,1);
}
.face{
  position:absolute;inset:0;box-sizing:border-box;
  background:linear-gradient(145deg,#fff 0%,#f3f3ee 100%);
  border:1px solid var(--face-edge);border-radius:16px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:16%;place-items:center;
  backface-visibility:hidden;
}
.f1{transform:translateZ(calc(var(--size)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--size)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--size)/2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--size)/2))}
.f5{transform:rotateY(-90deg) translateZ(calc(var(--size)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--size)/2))}
.pip{width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b93e6,var(--pip-blue) 60%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.25)}
.f1 .pip{width:100%;background:radial-gradient(circle at 35% 30%,#ff6b6b,var(--pip-red) 60%);grid-area:2/2}
.f1{padding:12%}
/* posiciones de los puntos (cuadrícula 3x3) */
.tl{grid-area:1/1}.tc{grid-area:1/2}.tr{grid-area:1/3}
.ml{grid-area:2/1}.mc{grid-area:2/2}.mr{grid-area:2/3}
.bl{grid-area:3/1}.bc{grid-area:3/2}.br{grid-area:3/3}
.shadow{
  position:absolute;left:50%;top:calc(100% + 34px);width:150px;height:22px;margin-left:-75px;
  background:radial-gradient(ellipse at center,rgba(40,50,70,.28),transparent 70%);
  transition:transform 1.5s ease-in-out,opacity 1.5s;pointer-events:none;
}
.shadow.go{animation:sh 1.5s ease-in-out}
@keyframes sh{0%,100%{transform:scale(1);opacity:1}40%{transform:scale(.7);opacity:.5}}
.ui{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:96px}
#resultado{font-size:1.6rem;margin:0;min-height:1.6em;text-align:center}
button{
  font:inherit;font-size:1.25rem;color:var(--ink);background:#fff;
  border:2px solid var(--ink);border-radius:12px;padding:8px 22px;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);
}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px dashed var(--pip-blue);outline-offset:3px}
button[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){.cube{transition-duration:.01s}.jump.go,.shadow.go{animation:none}}
</style>
</head>
<body>

<div class="stage" id="stage" tabindex="0" role="button" aria-label="Dado. Tocá para tirar">
  <div class="shadow" id="shadow"></div>
  <div class="jump" id="jump">
    <div class="cube" id="cube">
      <div class="face f1"><span class="pip"></span></div>
      <div class="face f2"><span class="pip tr"></span><span class="pip bl"></span></div>
      <div class="face f3"><span class="pip tr"></span><span class="pip mc"></span><span class="pip bl"></span></div>
      <div class="face f4"><span class="pip tl"></span><span class="pip tr"></span><span class="pip bl"></span><span class="pip br"></span></div>
      <div class="face f5"><span class="pip tl"></span><span class="pip tr"></span><span class="pip mc"></span><span class="pip bl"></span><span class="pip br"></span></div>
      <div class="face f6"><span class="pip tl"></span><span class="pip tr"></span><span class="pip ml"></span><span class="pip mr"></span><span class="pip bl"></span><span class="pip br"></span></div>
    </div>
  </div>
</div>
<div class="ui">
  <p id="resultado" aria-live="polite">Tocá el dado para tirar</p>
  <button id="btn" type="button">Tirar el dado</button>
</div>

<script>
(function(){
  var cube=document.getElementById('cube'),jump=document.getElementById('jump'),
      shadow=document.getElementById('shadow'),out=document.getElementById('resultado'),
      btn=document.getElementById('btn'),stage=document.getElementById('stage');
  // Cada cara n se lleva hacia arriba con una rotación en X y en Z; la cara de arriba es el resultado
  var UP={1:[90,0],2:[0,-90],3:[0,0],4:[180,0],5:[0,90],6:[-90,0]}; // [rotX, rotZ]
  var TILT=-50,x=90,y=25,z=0,rolling=false,last=0;
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function apply(){cube.style.transform='rotateX('+TILT+'deg) rotateY('+y+'deg) rotateZ('+z+'deg) rotateX('+x+'deg)'}
  function roll(){
    if(rolling)return; rolling=true; btn.disabled=true;
    var n=rnd(1,6),t=UP[n];
    x=Math.round(x/360)*360+360*rnd(1,2)+t[0];
    z=Math.round(z/360)*360+360*rnd(1,2)+t[1];
    y=Math.round((y-25)/360)*360+360*rnd(1,2)+25;
    out.textContent='…';
    apply();
    jump.classList.remove('go');shadow.classList.remove('go');void jump.offsetWidth;
    jump.classList.add('go');shadow.classList.add('go');
    setTimeout(function(){
      last=n;out.textContent='Salió el '+n+(n===1?' 🎃':'');
      rolling=false;btn.disabled=false;
    },1550);
  }
  stage.addEventListener('click',roll);
  stage.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();roll()}});
  btn.addEventListener('click',roll);
})();
</script>
</body>
</html>
